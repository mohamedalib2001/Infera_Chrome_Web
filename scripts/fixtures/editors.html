<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Editors fixture</title></head>
<body>
  <!-- Each block exposes the same public API surface as the real editor library, so the
       agent's adapters are exercised without loading the libraries from a CDN. -->
  <div id="mon" style="width:400px;height:120px"></div>
  <div class="CodeMirror" id="cm5" style="width:400px;height:80px"></div>
  <div class="ace_editor" id="ace" style="width:400px;height:80px"></div>
  <div class="cm-editor" id="cm6" style="width:400px;height:80px"><div class="cm-content" contenteditable="true"></div></div>
  <textarea id="code" rows="8" cols="60">SELECT 1;</textarea>
  <iframe name="inner" style="width:420px;height:120px" srcdoc="<div class='CodeMirror' id='e' style='width:300px;height:60px'></div><script>(() => { let v = 'x = 1'; document.getElementById('e').CodeMirror = { getValue: () => v, setValue: (t) => { v = t; }, getOption: () => 'python' }; })();</script>"></iframe>
  <!-- A cross-site frame (localhost vs 127.0.0.1): it runs in a process of its own. -->
  <iframe id="xsite" style="width:420px;height:120px"></iframe>
  <script>
    document.getElementById('xsite').src = `http://localhost:${location.port}/frame-editor.html`;
    // Monaco: monaco.editor.getEditors() → editor with getModel(), executeEdits()
    (() => {
      let value = 'function add(a, b) {\n  return a - b;\n}\n';
      const model = {
        getValue: () => value, getLanguageId: () => 'javascript', uri: { path: '/src/math.js' },
        getFullModelRange: () => ({ startLineNumber: 1, startColumn: 1, endLineNumber: 99, endColumn: 1 }),
      };
      const editor = { getModel: () => model, getDomNode: () => document.getElementById('mon'), pushUndoStop() {}, executeEdits: (_src, edits) => { value = edits[0].text; return true; } };
      window.monaco = { editor: { getEditors: () => [editor] } };
    })();
    // CodeMirror 5: element.CodeMirror
    (() => { let v = 'print("hello")'; document.getElementById('cm5').CodeMirror = { getValue: () => v, setValue: (t) => { v = t; }, getOption: () => 'python' }; })();
    // Ace: element.env.editor
    (() => { let v = 'body { color: red; }'; document.getElementById('ace').env = { editor: { getValue: () => v, session: { setValue: (t) => { v = t; }, getMode: () => ({ $id: 'ace/mode/css' }) } } }; })();
    // CodeMirror 6: .cm-content's cmView.rootView.view with state.doc and dispatch()
    (() => {
      let doc = 'SELECT * FROM users;';
      const view = { dom: document.getElementById('cm6'), get state() { return { doc: { toString: () => doc, length: doc.length } }; }, dispatch: ({ changes }) => { doc = doc.slice(0, changes.from) + changes.insert + doc.slice(changes.to); } };
      document.querySelector('#cm6 .cm-content').cmView = { rootView: { view } };
    })();
  </script>
</body>
</html>
