<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infera Agent Web</title>
  <link rel="stylesheet" href="../lib/theme.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Infera Agent Web">
      <img src="../icons/icon48.png" alt="" class="rail-logo">
      <button class="rail-btn on" id="btnHome" data-i18n-title="home" data-ic="home"></button>
      <button class="rail-btn" id="btnLive" data-i18n-title="liveTitle" data-ic="live"><i class="dot" hidden></i></button>
      <button class="rail-btn" id="btnHistory" data-i18n-title="history" data-ic="history"></button>
      <button class="rail-btn" id="btnStudio" data-i18n-title="studio" data-ic="workflow"></button>
      <button class="rail-btn" id="btnCosts" data-i18n-title="costs" data-ic="chart"></button>
      <span class="grow"></span>
      <button class="rail-btn" id="btnSettings" data-i18n-title="settings" data-ic="settings"></button>
    </nav>

    <div class="app">
      <header class="top">
        <div class="brand grow">
          <strong><span data-i18n="appName">Infera Agent</span> <span class="gradient-text">Web</span></strong>
          <span class="sub"><span id="status" class="status"></span><span id="taskCost" class="task-cost" hidden></span></span>
        </div>
        <span id="conn" class="conn" hidden><i></i><span data-i18n="connected"></span></span>
        <button class="icon-btn" id="btnNew" data-i18n-title="newChat" data-ic="plus"></button>
      </header>

      <button id="liveStrip" class="live-strip" type="button" hidden>
        <span class="ls-ring"></span>
        <span class="ls-text grow"><b id="lsStep"></b><span id="lsMeta" class="muted"></span></span>
        <span class="ls-bar"><i id="lsBar"></i></span>
      </button>

      <main id="messages" class="messages" aria-live="polite"></main>

      <section id="empty" class="home">
        <div class="hero">
          <img src="../icons/logo.png" alt="" class="hero-logo">
          <h2 data-i18n="emptyTitle"></h2>
          <p class="muted" data-i18n="emptyHint"></p>
        </div>
        <form id="signIn" class="card signin" hidden>
          <strong data-i18n="signInTitle"></strong>
          <p class="muted" data-i18n="signInHint"></p>
          <button class="btn primary" id="siSubmit" type="submit" data-i18n="signIn"></button>
          <div id="siError" class="si-error" hidden></div>
          <div class="si-links">
            <button type="button" class="linkish" id="siCreateAccount" data-i18n="createAccount"></button>
          </div>
        </form>
        <div id="noProvider" class="notice" hidden><span data-i18n="noProvider"></span></div>
        <div class="quick-actions" id="examples"></div>
        <div class="quick-tasks" id="quickTasks"></div>
        <div id="account" class="account" hidden>
          <span id="accountText"></span>
          <button type="button" class="linkish" id="btnSignOut" data-i18n="signOut"></button>
        </div>
      </section>

      <footer class="composer">
        <div id="slashMenu" class="slash-menu" hidden></div>
        <div id="routeChip" class="route-chip" hidden></div>
        <div id="attachments" class="attachments"></div>
        <div class="input-wrap">
          <textarea id="input" rows="2" data-i18n-placeholder="placeholder"></textarea>
          <div class="input-bar">
            <button class="icon-btn" id="btnAttach" data-i18n-title="attach" data-ic="camera"></button>
            <button class="icon-btn" id="btnFile" data-i18n-title="attachFile" data-ic="clip"></button>
            <input type="file" id="fileInput" multiple hidden>
            <select id="modelSel" class="mini-select" data-i18n-title="model"></select>
            <select id="modeSel" class="mini-select" data-i18n-title="mode"></select>
            <span class="grow"></span>
            <button class="send" id="btnSend" data-i18n-title="send" data-ic="send"></button>
            <button class="send stop" id="btnStop" data-i18n-title="stop" data-ic="stop" hidden></button>
          </div>
        </div>
        <p class="footnote muted" data-i18n="injection"></p>
      </footer>
    </div>
  </div>

  <!-- The live execution center -->
  <section id="live" class="panel-view" hidden aria-labelledby="liveTitle">
    <div class="pv-head">
      <button class="icon-btn" id="liveClose" data-i18n-title="close" data-ic="x"></button>
      <strong id="liveTitle" class="grow" data-i18n="liveTitle"></strong>
      <span id="livePill" class="pill"></span>
    </div>
    <div class="pv-body" id="liveBody"></div>
    <div class="pv-foot" id="liveFoot"></div>
  </section>

  <aside id="drawer" class="drawer" hidden>
    <div class="drawer-head">
      <strong id="drawerTitle" class="grow"></strong>
      <button class="icon-btn" id="drawerClose" data-i18n-title="close" data-ic="x"></button>
    </div>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>

  <dialog id="captureDlg" class="capture">
    <p class="muted" data-i18n="captureRegion"></p>
    <div class="capture-stage"><img id="captureImg" alt=""><div id="captureSel" class="sel" hidden></div></div>
    <div class="row" style="justify-content:flex-end;margin-top:10px">
      <button class="btn" id="capCancel" data-i18n="cancel"></button>
      <button class="btn" id="capFull" data-i18n="useFull"></button>
      <button class="btn primary" id="capRegion" data-i18n="useRegion"></button>
    </div>
  </dialog>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
